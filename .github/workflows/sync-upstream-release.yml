name: Sync sonn-core release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - upstream-release

permissions:
  contents: write

jobs:
  sync:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - app_dir: sonn-core
            channel: latest
            readme_label: Latest
          - app_dir: sonn-core-beta
            channel: beta
            readme_label: Beta
          - app_dir: sonn-core-canary
            channel: canary
            readme_label: Canary
    runs-on: ubuntu-latest
    steps:
      - name: Check out main branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Find latest upstream release for this channel
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail

          ghcr_manifest_exists() {
            local tag="$1"
            local token
            token="$(curl -fsSL 'https://ghcr.io/token?scope=repository:sonn-audio/core:pull' | jq -r '.token // empty')"
            if [ -z "$token" ]; then
              return 1
            fi

            local status
            status="$(curl -sS -o /tmp/ghcr-manifest.json -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/sonn-audio/core/manifests/$tag")"
            [ "$status" = "200" ]
          }

          case "$CHANNEL" in
            latest)
              stable_release_filter='select(.prerelease == false)'
              prerelease_filter='select(.prerelease == true)'
              ;;
            beta|canary)
              stable_release_filter='select(.prerelease == false)'
              prerelease_filter='select(.prerelease == true)'
              ;;
            *)
              echo "Unknown channel: $CHANNEL"
              exit 1
              ;;
          esac

          release_json="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            'https://api.github.com/repos/sonn-audio/core/releases?per_page=100')"

          stable_tag="$(printf '%s' "$release_json" | jq -r \
            "[.[] | $stable_release_filter | select(.draft == false)][0].tag_name")"
          prerelease_tag="$(printf '%s' "$release_json" | jq -r \
            "[.[] | $prerelease_filter | select(.draft == false)][0].tag_name")"

          if [ "$CHANNEL" = "latest" ]; then
            if ghcr_manifest_exists latest; then
              image_tag="latest"
              version="${stable_tag#v}"
            elif ghcr_manifest_exists latest-beta; then
              image_tag="latest-beta"
              version="${prerelease_tag#v}"
            else
              echo "No published stable GHCR image tag found for the latest channel."
              exit 1
            fi
          elif [ "$CHANNEL" = "beta" ]; then
            if [ -z "$prerelease_tag" ] || [ "$prerelease_tag" = "null" ]; then
              echo "No prerelease upstream release found for beta."
              exit 1
            fi
            image_tag="beta-latest"
            version="${prerelease_tag#v}"
          else
            if [ -z "$prerelease_tag" ] || [ "$prerelease_tag" = "null" ]; then
              echo "No prerelease upstream release found for canary."
              exit 1
            fi
            image_tag="dev-latest"
            version="${prerelease_tag#v}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Update app metadata and image
        id: update
        env:
          APP_DIR: ${{ matrix.app_dir }}
          README_LABEL: ${{ matrix.readme_label }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          set -euo pipefail

          sed -i -E "s/^version: .*/version: $VERSION/" "$APP_DIR/config.yaml"
          sed -i -E "s|^FROM ghcr.io/sonn-audio/core:.*|FROM ghcr.io/sonn-audio/core:$IMAGE_TAG|" "$APP_DIR/Dockerfile"
          sed -i -E "s/^The $README_LABEL app tracks sonn-audio\/core \*\*.*\*\*\.$/The $README_LABEL app tracks sonn-audio\/core **$VERSION**./" README.md
          if ! grep -q "^## $VERSION$" "$APP_DIR/CHANGELOG.md"; then
            sed -i -E "0,/^## /s//## $VERSION\n\n- Track the sonn-audio\/core $VERSION release.\n\n## /" "$APP_DIR/CHANGELOG.md"
          fi

          if git diff --quiet -- README.md "$APP_DIR"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push update
        if: steps.update.outputs.changed == 'true'
        env:
          APP_DIR: ${{ matrix.app_dir }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md "$APP_DIR"
          git commit -m "Update sonn-core $CHANNEL to $VERSION"
          git push origin HEAD:main
